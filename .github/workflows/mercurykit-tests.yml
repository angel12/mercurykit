name: MercuryKit Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record revision and toolchain
        run: |
          git rev-parse HEAD
          xcodebuild -version
          swift --version
      - name: Run standalone suite
        run: swift test
      - name: Check external API and negative Codable constraints
        run: python3 scripts/check-api-constraints.py
